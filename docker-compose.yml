services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - nearbly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Nearbly.Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Issuer: ${Jwt__Issuer:-Nearbly}
      Jwt__Audience: ${Jwt__Audience:-Nearbly.Admin}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env}
      Jwt__ExpirationMinutes: ${Jwt__ExpirationMinutes:-60}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:?Set BootstrapAdmin__Email in .env}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:?Set BootstrapAdmin__Password in .env}
      BootstrapAdmin__DisplayName: ${BootstrapAdmin__DisplayName:-Nearbly Admin}
      Media__Provider: ${Media__Provider:-filesystem}
      Media__RootPath: /var/lib/nearbly/media
      Media__S3__Endpoint: ${Media__S3__Endpoint:-}
      Media__S3__Bucket: ${Media__S3__Bucket:-}
      Media__S3__AccessKey: ${Media__S3__AccessKey:-}
      Media__S3__SecretKey: ${Media__S3__SecretKey:-}
      Cors__AllowedOrigins__0: http://127.0.0.1:55040
      Cors__AllowedOrigins__1: http://localhost:55040
      Cors__AllowedOrigins__2: http://localhost:4321
      Swagger__Enabled: "true"
    ports:
      - "5112:8080"
    volumes:
      - nearbly-media:/var/lib/nearbly/media

volumes:
  nearbly-postgres:
  nearbly-media:
